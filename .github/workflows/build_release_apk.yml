name: Build release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de release, por ejemplo v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal release APK
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Prepare release asset
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "Rumbo-${TAG}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rumbo-release-apk
          path: Rumbo-*-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "Rumbo-${RELEASE_TAG}-release.apk" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "Rumbo-${RELEASE_TAG}-release.apk" \
              --title "Rumbo ${RELEASE_TAG}" \
              --notes "APK Android release construido automáticamente por GitHub Actions. Verificá permisos y privacidad antes de instalar."
          fi
